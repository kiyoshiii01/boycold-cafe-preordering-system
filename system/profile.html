<script>
const profileKey='boycoldProfile';
const defaultProfile={name:'Juan Dela Cruz',email:'juandelacruz@example.com',phone:'09123456789',pickup_preference:'Standard Counter Pickup'};
const savedProfile=JSON.parse(localStorage.getItem(profileKey)||'null');
const profile=savedProfile||defaultProfile;
['name','email','phone','pickup_preference'].forEach(name=>{
 const el=document.querySelector(`[name="${name}"]`);
 if(el) el.value=profile[name]||'';
});
document.querySelector('form')?.addEventListener('submit',e=>{
 e.preventDefault();
 const data={};
 ['name','email','phone','pickup_preference'].forEach(name=>{
  const el=document.querySelector(`[name="${name}"]`);
  if(el) data[name]=el.value;
 });
 localStorage.setItem(profileKey,JSON.stringify(data));
 alert('Profile successfully updated!');
});
</script></body>
