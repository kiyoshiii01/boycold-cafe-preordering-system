<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Boycold Cafe - Create Account</title>
<style>
        * {
            box-sizing: border-box;
        }

        body.form-page {
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                linear-gradient(rgba(30, 20, 15, 0.65), rgba(30, 20, 15, 0.65)),
                url('images/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .form-box-container {
            width: 100%;
            max-width: 480px;
            background: rgba(45, 30, 22, 0.82);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(5px);
            text-align: left;
        }

        .form-title {
            color: white;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            font-size: 2.3rem;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #f3e5d8;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #8D6E63;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(141, 110, 99, 0.3);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #8D6E63 0%, #5c3a21 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #a17f72 0%, #7b4e2d 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }

        .form-footer-link {
            text-align: center;
            margin-top: 22px;
        }

        .form-footer-link a {
            color: #f3e5d8;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px dashed #f3e5d8;
            transition: color 0.2s;
        }

        .form-footer-link a:hover {
            color: #ffffff;
            border-bottom-color: #ffffff;
        }

        @media (max-width: 480px) {
            body.form-page {
                padding: 20px 15px;
            }

            .form-box-container {
                padding: 30px 20px;
            }

            .form-title {
                font-size: 2rem !important;
            }
        }
    </style>
</head>
<body class="form-page">
<div class="form-box-container">
<h1 class="form-title">Create Account</h1>
<form action="#" method="POST">
<div class="input-group">
<label>Full Name</label>
<input name="fullname" placeholder="Enter full name" required="" type="text"/>
</div>
<div class="input-group">
<label>Email</label>
<input name="email" placeholder="Enter email" required="" type="email"/>
</div>
<div class="input-group">
<label>Phone Number</label>
<input name="phone" placeholder="Enter phone number" required="" type="tel"/>
</div>
<div class="input-group">
<label>Password</label>
<input name="password" placeholder="Enter password" required="" type="password"/>
</div>
<div class="input-group">
<label>Confirm Password</label>
<input name="confirm_password" placeholder="Confirm password" required="" type="password"/>
</div>
<div style="margin-top: 25px;">
<button class="submit-btn" type="submit">
                    Register
                </button>
</div>
</form>
<div class="form-footer-link">
<a href="login.html">← Back to Login</a>
</div>
</div>
<script>
document.querySelector('form')?.addEventListener('submit',function(e){
 e.preventDefault();
 const fullname=this.fullname.value.trim(), email=this.email.value.trim().toLowerCase();
 const password=this.password.value, confirm=this.confirm_password.value;
 if(!fullname || !email || !password){alert('Please complete all required fields.');return;}
 if(password!==confirm){alert('Passwords do not match.');return;}
 localStorage.setItem('boycoldRegisteredUser',JSON.stringify({fullname,email,phone:this.phone.value,password}));
 alert('Account created successfully!');
 location.href='login.html';
});
</script></body>
</html>
